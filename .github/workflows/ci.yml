name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The image's default locale is en_US.utf8: tests/contract/test_database.py relies on a
        # non-C default collation to prove the scope column's own C collation (design §3.3).
        image: pgvector/pgvector:0.8.6-pg18
        env:
          # No password: the container lives only for this job and listens only on the runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lite_cache
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 1s --health-timeout 5s --health-retries 30
    env:
      LITECACHE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/lite_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
