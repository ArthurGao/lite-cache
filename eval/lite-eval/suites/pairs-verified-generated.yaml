# S3c L2 verifier calibration (lite-cache design §13.3): the generated domain set, in full.
#   uv run lite-eval run eval/lite-eval/suites/pairs-verified-generated.yaml   # Ollama: bge-m3 + the judge
# The target outputs the cosine and, from 0.80 up, the verifier's verdict; eval/pairs/calibrate.py
# applies the guard, chooses the floor on dev and gates it on test. Scorer: a shape check.
name: pairs-verified-generated
dataset: ../../pairs/generated
targets:
  - python: lite_cache.eval_target:verified_pairs
    configs:
      - {name: qwen3-8b, model: "bge-m3:567m", dim: 1024, judge: "qwen3:8b"}
scorers:
  - regex: {pattern: '"cosine":-?[0-9]'}
