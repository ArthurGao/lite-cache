[project]
name = "lite-cache"
version = "0.3.2"
description = "An LLM response cache for the lite modules: a lite-model hook over PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Pinned exactly, the same versions as lite-model and lite-rag (AGENTS.md rule 8). lite-model is the
# only sibling imported at run time (AGENTS.md rule 5): its hook protocol and reply types. It is a
# direct URL in the metadata, not a [tool.uv.sources] entry: lite-model is not on PyPI, and the
# wheel must install on its own (a sources entry does not reach the wheel's metadata; S1.5).
dependencies = [
    "lite-model @ https://github.com/ArthurGao/lite-model/releases/download/v0.7.0/lite_model-0.7.0-py3-none-any.whl",
    "psycopg[binary,pool]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "typer==0.27.3",
]

[project.optional-dependencies]
# The L2 pairs evaluation (design §8, S3b): lite-eval runs it, pyarrow reads the PAWS parquet files.
eval = [
    "lite-eval @ https://github.com/ArthurGao/lite-eval/releases/download/v0.4.1/lite_eval-0.4.1-py3-none-any.whl",
    "pyarrow==26.0.1",
]

[project.scripts]
litecache = "lite_cache.cli:app"

[dependency-groups]
dev = [
    # AGENTS rule 5: lite-eval is a dev dependency too, so CI tests the eval target.
    "lite-cache[eval]",
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.format]
# Code blocks in docs are hand-aligned illustrations, not code.
exclude = ["*.md"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts", "eval"]
mypy_path = "src"

[[tool.mypy.overrides]]
# pyarrow ships no type information (eval extra only).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in, deselected by default: `uv run pytest -m ollama` (the real Ollama on the host).
addopts = "-m 'not ollama'"
markers = ["ollama: talks to the real local Ollama (opt-in: uv run pytest -m ollama)"]
